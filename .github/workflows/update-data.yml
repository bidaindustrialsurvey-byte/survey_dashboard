name: Update dashboard data

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: update-dashboard
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Pull from Kobo and aggregate
        env:
          KOBO_TOKEN: ${{ secrets.KOBO_TOKEN }}
          KOBO_ASSET_UID: ${{ secrets.KOBO_ASSET_UID }}
          KOBO_SERVER: https://kf.kobotoolbox.org
          KOBO_DEBUG: "1"
        run: python scripts/fetch_kobo.py

      - name: Commit data.json if it changed
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git reset --soft origin/main
          git add data.json
          git diff --cached --quiet || git commit -m "Update dashboard data [skip ci]"
          git push
