name: Update dashboard data

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: update-dashboard
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Census of Foreign/JV Industries
        env:
          KOBO_TOKEN: ${{ secrets.KOBO_TOKEN }}
          KOBO_ASSET_UID: ${{ secrets.KOBO_ASSET_UID }}
          KOBO_SERVER: https://kf.kobotoolbox.org
          KOBO_DEBUG: "1"
        run: python scripts/fetch_kobo.py census

      - name: Survey of Industries (same Kobo account)
        env:
          KOBO_TOKEN: ${{ secrets.KOBO_TOKEN }}
          KOBO_ASSET_UID_SURVEY: ${{ secrets.KOBO_ASSET_UID_SURVEY }}
          KOBO_SERVER: https://kf.kobotoolbox.org
          KOBO_DEBUG: "1"
        run: python scripts/fetch_kobo.py survey

      - name: Unsuccessful surveys (Google Sheet)
        continue-on-error: true
        env:
          UNSUCCESSFUL_SHEET_URL: ${{ secrets.UNSUCCESSFUL_SHEET_URL }}
          # one tab per status: "Status name=gid" (gid = the #gid=... part of the tab's address)
          UNSUCCESSFUL_TABS: "Not Found=448647754; Closed=960313769; Rejected=66619800; Delayed=1620812123"
        run: python scripts/fetch_sheet.py

      - name: Commit data files if they changed
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          [ -f data-survey.json ] && git add data-survey.json
          [ -f data-unsuccessful.json ] && git add data-unsuccessful.json
          git diff --cached --quiet && exit 0
          git commit -m "Update dashboard data"
          git pull --rebase origin main
          git push origin main
